# Apocrypha — Local Screeps Server Configuration
# Managed by screeps-launcher

# Server
server:
  port: 21025
  host: 0.0.0.0

# Game settings
game:
  # Accelerate ticks for fast iteration
  tickRate: 1000  # ms per tick (1000 = 1 tick/sec, lower = faster)

# No external auth for local dev
backend:
  mongo:
    host: mongo
    port: 27017
    database: screeps
  redis:
    host: redis
    port: 6379

# Mods (code injection)
mods:
  - screepsmod-auth
  - screepsmod-mongo

# Environment
env:
  backend: mongo
  modfile: mods.json
  steamApiKey: ""
  serverPassword: ""  # empty = no password
