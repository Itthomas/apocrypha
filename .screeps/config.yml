# Apocrypha — Local Screeps Private Server
# Uses screepsmod-auth for password-based login (no Steam required)

# Set your Steam API key here or as STEAM_KEY env var
# Free key at https://steamcommunity.com/dev/apikey
# steamKey: "YOUR_KEY_HERE"

pinnedPackages:
  ssri: 8.0.1
  cacache: 15.3.0
  passport-steam: 1.0.17
  minipass-fetch: 2.1.2
  express-rate-limit: 6.7.0

mods:
  - screepsmod-auth
  - screepsmod-admin-utils
  - screepsmod-mongo

serverConfig:
  tickRate: 1000
  welcomeText: |
    <h1 style="text-align:center">Apocrypha Dev Server</h1>
    <p style="text-align:center"><em>"The empire begins here."</em></p>
